name: SAST - SonarCloud

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set project metadata
        run: |
          echo "PROJECT_KEY=${{ github.repository_owner }}_$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Clean Gradle build
        run: ./gradlew clean

      - name: Run JVM tests (best effort)
        run: |
          ./gradlew test || echo "No JVM tests found"

      - name: Generate Kover XML coverage (best effort)
        run: |
          ./gradlew koverXmlReport || echo "Kover XML report not generated"

      - name: Configure Sonar sources
        run: |
          echo "SONAR_SOURCES=verifierApp/src/commonMain,verifierApp/src/androidMain,androidVerifierApp/src/main" >> $GITHUB_ENV
          echo "SONAR_EXCLUSIONS=**/iosVerifierApp/**,**/build/**,**/.gradle/**,**/fastlane/**" >> $GITHUB_ENV

          echo "Using Sonar sources:"
          echo "$SONAR_SOURCES"

      - name: Run SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v8.1.0
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ env.PROJECT_KEY }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=${{ env.SONAR_SOURCES }}
            -Dsonar.exclusions=${{ env.SONAR_EXCLUSIONS }}
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
            -Dsonar.scanner.skipJreProvisioning=true
